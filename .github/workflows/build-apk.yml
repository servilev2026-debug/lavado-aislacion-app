name: Build APK - Lavado de Aislación

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Regenerar estructura Android de Flutter
        run: flutter create --platforms=android --org cl.servilev --project-name lavado_aislacion .

      - name: Verificar Flutter
        run: flutter doctor -v

      - name: Obtener dependencias
        run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --release

      - name: Publicar APK
        uses: actions/upload-artifact@v6
        with:
          name: lavado-aislacion-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
